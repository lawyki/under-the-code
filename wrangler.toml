# Cloudflare Pages configuration — bindings for the account/position API.
# The site itself is still plain static files in public/; functions/ holds
# the Pages Functions behind /api/*. Git pushes to main deploy both.
name = "under-the-code"
compatibility_date = "2026-06-01"
pages_build_output_dir = "public"

# D1: users, sessions, one-time login tokens, one reading position per user.
[[d1_databases]]
binding = "DB"
database_name = "under-book"
database_id = "a3dc4bc2-5ff7-4715-ae3a-e937a88dacae"

# Magic-link mail is sent via the Cloudflare Email Sending REST API — the
# [[send_email]] binding is Workers-only (Pages config validation rejects it).
# Requires Email Sending enabled for atheric.eu plus a Pages secret:
#   npx wrangler pages secret put EMAIL_API_TOKEN --project-name under-the-code
# Until the secret exists, /api/auth/request answers 503 delivery_unavailable.
[vars]
CF_ACCOUNT_ID = "1ae05809e015cd076b0e28c3b2e1d08b"
