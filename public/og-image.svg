<?xml version="1.0" encoding="UTF-8"?>
<!--
  Under the Code — Open Graph image
  1200×630 (Open Graph standard).
  Composition: the book's own closing visual metaphor (Fig 18.6) — concentric
  layers expanding from a transistor — used as the brand mark. Wordmark and
  tagline below. ATHERIC publisher mark in the corner.
  For raster fallback, run: rsvg-convert -w 1200 -h 630 og-image.svg -o og-image.png
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="og-title">
  <title id="og-title">Under the Code — From transistor to civilization</title>

  <defs>
    <radialGradient id="ogGlow" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#d4a853" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#d4a853" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0a"/>
  <rect width="1200" height="630" fill="url(#ogGlow)"/>

  <!-- Mark: concentric layers expanding from a transistor at center -->
  <g transform="translate(600, 240)">
    <!-- Civilization (outermost) -->
    <circle r="190" fill="none" stroke="rgba(212,168,83,0.18)" stroke-width="1" stroke-dasharray="4,4"/>
    <!-- Cloud -->
    <circle r="148" fill="none" stroke="rgba(212,168,83,0.30)" stroke-width="1" stroke-dasharray="4,4"/>
    <!-- Network -->
    <circle r="110" fill="none" stroke="rgba(212,168,83,0.46)" stroke-width="1" stroke-dasharray="4,4"/>
    <!-- Kernel -->
    <circle r="76" fill="none" stroke="rgba(212,168,83,0.64)" stroke-width="1" stroke-dasharray="4,4"/>
    <!-- CPU (solid) -->
    <circle r="44" fill="none" stroke="rgba(212,168,83,0.92)" stroke-width="1.5"/>

    <!-- Transistor at center -->
    <rect x="-15" y="-7.5" width="30" height="15" rx="1.8" fill="rgba(212,168,83,1)"/>
  </g>

  <!-- Wordmark -->
  <text x="600" y="475" text-anchor="middle"
        font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
        font-style="italic"
        font-weight="400"
        font-size="82"
        fill="rgba(245,240,235,0.95)"
        letter-spacing="0.005em">Under the <tspan font-weight="500" fill="rgba(212,168,83,1)">Code</tspan></text>

  <!-- Tagline -->
  <text x="600" y="528" text-anchor="middle"
        font-family="'DM Mono', 'IBM Plex Mono', 'Menlo', monospace"
        font-size="17"
        fill="rgba(212,168,83,0.62)"
        letter-spacing="0.32em">FROM TRANSISTOR TO CIVILIZATION</text>
  <text x="600" y="556" text-anchor="middle"
        font-family="'DM Mono', 'IBM Plex Mono', 'Menlo', monospace"
        font-size="12"
        fill="rgba(212,168,83,0.38)"
        letter-spacing="0.4em">EIGHTEEN  CHAPTERS</text>

  <!-- Atheric publisher mark, lower-right -->
  <g transform="translate(1108, 596)">
    <line x1="-22" y1="0" x2="-6" y2="0" stroke="rgba(212,168,83,0.4)" stroke-width="0.8"/>
    <text x="0" y="4" text-anchor="start"
          font-family="'DM Mono', 'IBM Plex Mono', 'Menlo', monospace"
          font-size="10"
          fill="rgba(212,168,83,0.55)"
          letter-spacing="0.28em">ATHERIC</text>
  </g>
</svg>
